services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: expense_tracker
      POSTGRES_DB: expense_tracker

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U expense_tracker -d expense_tracker",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]

    environment:
      DATABASE_URL: postgresql://expense_tracker:expense_tracker@db:5432/expense_tracker
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}"

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  api:
    build: .

    environment:
      DATABASE_URL: postgresql://expense_tracker:expense_tracker@db:5432/expense_tracker
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}"

    ports:
      - "8000:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data: